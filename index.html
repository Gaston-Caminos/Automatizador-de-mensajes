<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Automatizador de mensajes</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #eef2f6;
      margin: 0;
      padding: 18px;
      color: #1e293b;
    }
    .card {
      max-width: 560px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    }
    h1 {
      margin: 0 0 8px 0;
      font-size: 26px;
    }
    .estado {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 16px;
      padding: 8px 14px;
      border-radius: 10px;
      display: inline-block;
    }
    .pendiente { background: #fef3c7; color: #b45309; }
    .enviado { background: #d1fae5; color: #065f46; }
    label, .titulo-seccion {
      font-size: 19px;
      font-weight: 600;
      display: block;
      margin-bottom: 8px;
    }
    textarea {
      width: 100%;
      height: 135px;
      font-size: 21px;
      padding: 14px;
      border-radius: 14px;
      border: 2px solid #cbd5e1;
      box-sizing: border-box;
      font-family: inherit;
      line-height: 1.4;
    }
    .preview-box {
      margin-top: 14px;
      text-align: center;
      background: #f8fafc;
      padding: 12px;
      border-radius: 14px;
      border: 1px solid #e2e8f0;
    }
    .preview-box img {
      max-width: 100%;
      max-height: 220px;
      border-radius: 10px;
    }
    .btn-quitar {
      margin-top: 8px;
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      background: white;
      cursor: pointer;
    }
    .btn-foto {
      width: 100%;
      background: #e0f2fe;
      color: #0369a1;
      border: 2px solid #bae6fd;
      padding: 14px;
      font-size: 19px;
      font-weight: bold;
      border-radius: 14px;
      margin-top: 12px;
      cursor: pointer;
    }
    .btn-enviar {
      width: 100%;
      background: #16a34a;
      color: white;
      border: none;
      padding: 22px;
      font-size: 23px;
      font-weight: bold;
      border-radius: 16px;
      margin-top: 18px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(22, 163, 74, 0.3);
    }
    details {
      margin-top: 26px;
      padding-top: 14px;
      border-top: 2px dashed #cbd5e1;
      font-size: 16px;
    }
    summary {
      font-weight: bold;
      cursor: pointer;
      color: #475569;
      padding: 6px 0;
    }
    input[type="text"] {
      width: 100%;
      font-size: 17px;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      box-sizing: border-box;
      margin-bottom: 12px;
    }
    .btn-guardar {
      width: 100%;
      background: #334155;
      color: white;
      border: none;
      padding: 12px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="card">
  <h1 id="titulo-dia">☀️ Mensaje de Hoy</h1>
  <div id="badge-estado" class="estado pendiente">⏳ Hoy todavía no enviaste mensajes a este número</div>

  <label for="texto-hoy">Mensaje a enviar (podés retocarlo acá si querés):</label>
  <textarea id="texto-hoy" placeholder="Conectando con la planilla..."></textarea>

  <div id="contenedor-imagen" class="preview-box" style="display:none;">
    <div id="lbl-foto" class="titulo-seccion">📷 Foto lista para enviar hoy:</div>
    <img id="img-preview" src="" alt="Vista previa">
    <br>
    <button type="button" id="btn-quitar-foto" class="btn-quitar">❌ Quitar foto</button>
  </div>

  <input type="file" id="input-foto-dia" accept="image/*" style="display:none">
  <button type="button" id="btn-elegir-foto" class="btn-foto">
    📷 Elegir o cambiar foto de la galería
  </button>

  <button type="button" id="btn-enviar-wpp" class="btn-enviar">
    💬 ABRIR WHATSAPP Y ENVIAR
  </button>

  <details>
    <summary>⚙️ Configuración (Teléfono y Planilla Excel/Google)</summary>
    <div style="margin-top:12px;">
      <label for="telefono" style="font-size:16px;">📞 Teléfono a enviar (con 549...):</label>
      <input type="text" id="telefono" value="5491156378127" placeholder="Ej: 5491156378127">

      <label for="sheet-url" style="font-size:16px;">📊 Link de la Planilla de Google Sheets:</label>
      <input type="text" id="sheet-url" value="https://docs.google.com/spreadsheets/d/1oXpRzPNlI0kY9bhV5HNKCFqk-tmBIp4YRWlCyt-gwD4/edit?usp=drive_link" placeholder="Pegá acá el enlace de la planilla compartida">

      <button type="button" id="btn-guardar-config" class="btn-guardar">💾 Guardar y sincronizar planilla</button>
    </div>
  </details>
</div>

<script>
  // =========================================================================
  // DATOS FIJOS PREDETERMINADOS
  // =========================================================================
  const TELEFONO_FIJO = "5491156378127";
  const PLANILLA_FIJA = "https://docs.google.com/spreadsheets/d/1oXpRzPNlI0kY9bhV5HNKCFqk-tmBIp4YRWlCyt-gwD4/edit?usp=drive_link";
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzzMvppseiPWtKM1RJ6iRADN6R4GUEySrufwsDZrksvL0qfw1frJXxCWGgWjqSdvMVK/exec";
  // =========================================================================

  const DIAS = ["Domingo", "Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado"];
  const ahora = new Date();
  const diaHoy = ahora.getDate();
  const mesHoy = ahora.getMonth() + 1;
  const anioHoy = ahora.getFullYear();
  const nombreDiaHoy = DIAS[ahora.getDay()];
  const fechaHoyStr = `${String(diaHoy).padStart(2, "0")}/${String(mesHoy).padStart(2, "0")}/${anioHoy}`;
  let archivoImagenHoy = null;

  window.addEventListener("DOMContentLoaded", () => {
    document.getElementById("titulo-dia").innerText = `☀️ ${nombreDiaHoy} (${fechaHoyStr})`;

    const telGuardado = localStorage.getItem("telefono_hermano");
    const urlGuardada = localStorage.getItem("sheet_url");

    document.getElementById("telefono").value = TELEFONO_FIJO || telGuardado || "";
    document.getElementById("sheet-url").value = PLANILLA_FIJA || urlGuardada || "";

    document.getElementById("btn-elegir-foto").addEventListener("click", () => {
      document.getElementById("input-foto-dia").click();
    });
    document.getElementById("input-foto-dia").addEventListener("change", seleccionarFotoGaleria);
    document.getElementById("btn-quitar-foto").addEventListener("click", quitarFoto);
    document.getElementById("btn-enviar-wpp").addEventListener("click", enviarMensaje);
    document.getElementById("telefono").addEventListener("input", actualizarEstadoVisual);
    document.getElementById("btn-guardar-config").addEventListener("click", guardarConfiguracion);

    actualizarEstadoVisual();
    cargarDesdePlanilla(false);
  });

  function coincideConFechaHoy(textoCelda) {
    if (!textoCelda) return false;
    const str = String(textoCelda).trim();

    // Si Google devuelve formato Date(YYYY, M, D)
    const matchGoogleDate = str.match(/Date\((\d{4}),\s*(\d{1,2}),\s*(\d{1,2})\)/);
    if (matchGoogleDate) {
      const a = parseInt(matchGoogleDate[1], 10);
      const m = parseInt(matchGoogleDate[2], 10) + 1;
      const d = parseInt(matchGoogleDate[3], 10);
      return d === diaHoy && m === mesHoy && a === anioHoy;
    }

    // Si viene en formato ISO (YYYY-MM-DD)
    const matchISO = str.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
    if (matchISO) {
      const a = parseInt(matchISO[1], 10);
      const m = parseInt(matchISO[2], 10);
      const d = parseInt(matchISO[3], 10);
      return d === diaHoy && m === mesHoy && a === anioHoy;
    }

    // Formato tradicional DD/MM/YYYY o DD/MM
    const matchDMY = str.match(/(\d{1,2})[\/\-](\d{1,2})(?:[\/\-](\d{2,4}))?/);
    if (matchDMY) {
      const d = parseInt(matchDMY[1], 10);
      const m = parseInt(matchDMY[2], 10);
      let a = matchDMY[3] ? parseInt(matchDMY[3], 10) : anioHoy;
      if (a < 100) a += 2000;
      return d === diaHoy && m === mesHoy && a === anioHoy;
    }
    return false;
  }

  function obtenerClaveContador(numero) {
    const numLimpio = (numero || "").replace(/\D/g, "");
    return `envios_${fechaHoyStr}_${numLimpio}`;
  }

  function actualizarEstadoVisual() {
    const numero = document.getElementById("telefono").value;
    const clave = obtenerClaveContador(numero);
    const cantidadHoy = parseInt(localStorage.getItem(clave) || "0", 10);
    const badge = document.getElementById("badge-estado");

    if (cantidadHoy > 0) {
      badge.className = "estado enviado";
      const palabra = cantidadHoy === 1 ? "mensaje" : "mensajes";
      badge.innerText = `✅ Enviados a este número hoy: ${cantidadHoy} ${palabra}`;
    } else {
      badge.className = "estado pendiente";
      badge.innerText = "⏳ Hoy todavía no enviaste mensajes a este número";
    }
  }

  function guardarConfiguracion() {
    localStorage.setItem("telefono_hermano", document.getElementById("telefono").value.trim());
    localStorage.setItem("sheet_url", document.getElementById("sheet-url").value.trim());
    actualizarEstadoVisual();
    cargarDesdePlanilla(true);
  }

  function extraerIdPlanilla(urlOriginal) {
    if (!urlOriginal) return "";
    const match = urlOriginal.match(/\/d\/([a-zA-Z0-9-_]+)/);
    return (match && match[1]) ? match[1] : "";
  }

  function parsearCSV(texto) {
    const filas = [];
    let filaActual = [];
    let celda = "";
    let entreComillas = false;

    for (let i = 0; i < texto.length; i++) {
      const char = texto[i];
      const sig = texto[i + 1];
      if (char === '"' && entreComillas && sig === '"') {
        celda += '"';
        i++;
      } else if (char === '"') {
        entreComillas = !entreComillas;
      } else if (char === ',' && !entreComillas) {
        filaActual.push(celda);
        celda = "";
      } else if ((char === '\n' || char === '\r') && !entreComillas) {
        if (char === '\r' && sig === '\n') i++;
        filaActual.push(celda);
        filas.push(filaActual);
        filaActual = [];
        celda = "";
      } else {
        celda += char;
      }
    }
    if (celda || filaActual.length > 0) {
      filaActual.push(celda);
      filas.push(filaActual);
    }
    return filas;
  }

  function procesarFilasPlanilla(filas, mostrarAlerta) {
    let mensajeEncontrado = false;

    for (const fila of filas) {
      const colA = String(fila[0] || "").trim();
      const textoColumnaB = String(fila[1] || "").trim();
      const imagenColumnaC = String(fila[2] || "").trim();
      const colD = String(fila[3] || "").trim();

      const esFechaDeHoy = coincideConFechaHoy(colA) || coincideConFechaHoy(colD);
      const yaFueEnviado = colD.includes("✅");

      if (fila.length >= 2 && esFechaDeHoy && !yaFueEnviado) {
        document.getElementById("texto-hoy").value = textoColumnaB;
        document.getElementById("texto-hoy").placeholder = "Escribí acá el mensaje para hoy...";
        if (imagenColumnaC) {
          cargarImagenDesdeUrl(imagenColumnaC);
        } else {
          quitarFoto();
        }
        mensajeEncontrado = true;
        break;
      }
    }

    if (!mensajeEncontrado) {
      document.getElementById("texto-hoy").value = "";
      document.getElementById("texto-hoy").placeholder = `⚠️ Leí la planilla correctamente, pero no hay ninguna fila pendiente con la fecha de hoy (${fechaHoyStr}).`;
    }

    if (mostrarAlerta) alert("¡Planilla conectada y sincronizada!");
  }

  // Motor de respaldo JSONP: salta cualquier bloqueo CORS de GitHub Pages
  function cargarPorJSONP(sheetId, mostrarAlerta) {
    window.recibirDatosPlanilla = function(respuesta) {
      try {
        const filas = (respuesta.table.rows || []).map(r => {
          return (r.c || []).map(celda => {
            if (!celda) return "";
            if (celda.f !== undefined && celda.f !== null) return String(celda.f);
            if (celda.v !== undefined && celda.v !== null) return String(celda.v);
            return "";
          });
        });
        procesarFilasPlanilla(filas, mostrarAlerta);
      } catch (e) {
        document.getElementById("texto-hoy").placeholder = "❌ Error al leer las celdas de la planilla.";
      }
    };

    const viejo = document.getElementById("jsonp-sheets");
    if (viejo) viejo.remove();

    const script = document.createElement("script");
    script.id = "jsonp-sheets";
    script.src = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=responseHandler:recibirDatosPlanilla&t=${Date.now()}`;
    script.onerror = () => {
      document.getElementById("texto-hoy").placeholder = "❌ Google bloqueó el acceso externo. En tu planilla andá a: Archivo -> Compartir -> Publicar en la web -> Publicar.";
      if (mostrarAlerta) alert("Falta habilitar 'Publicar en la web' en el menú Archivo de Google Sheets.");
    };
    document.body.appendChild(script);
  }

  async function cargarDesdePlanilla(mostrarAlerta = false) {
    const rawUrl = document.getElementById("sheet-url").value.trim();
    const sheetId = extraerIdPlanilla(rawUrl);

    if (!sheetId) {
      document.getElementById("texto-hoy").placeholder = "Escribí acá el mensaje para hoy o configurá la planilla abajo...";
      return;
    }

    // Intenta primero con JSONP (inmune a bloqueos de páginas estáticas como GitHub Pages)
    cargarPorJSONP(sheetId, mostrarAlerta);
  }

  async function cargarImagenDesdeUrl(url) {
    try {
      document.getElementById("img-preview").src = url;
      document.getElementById("contenedor-imagen").style.display = "block";
      const resp = await fetch(url);
      const blob = await resp.blob();
      archivoImagenHoy = new File([blob], "foto_del_dia.jpg", { type: blob.type || "image/jpeg" });
    } catch (e) {
      console.log("La imagen se muestra pero requiere seleccionarse local si el servidor externo bloquea CORS.");
    }
  }

  function seleccionarFotoGaleria(event) {
    const file = event.target.files[0];
    if (!file) return;
    archivoImagenHoy = file;
    document.getElementById("img-preview").src = URL.createObjectURL(file);
    document.getElementById("contenedor-imagen").style.display = "block";
  }

  function quitarFoto() {
    archivoImagenHoy = null;
    document.getElementById("contenedor-imagen").style.display = "none";
    document.getElementById("input-foto-dia").value = "";
  }

  async function enviarMensaje() {
    const texto = document.getElementById("texto-hoy").value.trim();
    const numero = (document.getElementById("telefono").value || "").replace(/\D/g, "");

    if (!texto && !archivoImagenHoy) {
      alert("Escribí un mensaje o elegí una foto antes de enviar.");
      return;
    }

    const clave = obtenerClaveContador(numero);
    const cantidadActual = parseInt(localStorage.getItem(clave) || "0", 10);
    localStorage.setItem(clave, cantidadActual + 1);
    actualizarEstadoVisual();

    if (APPS_SCRIPT_URL && APPS_SCRIPT_URL.includes("/exec")) {
      const peticion = fetch(`${APPS_SCRIPT_URL}?fecha=${encodeURIComponent(fechaHoyStr)}&t=${Date.now()}`, { 
        mode: "no-cors",
        keepalive: true
      }).catch(() => {});
      
      await Promise.race([
        peticion,
        new Promise(resolve => setTimeout(resolve, 600))
      ]);
    }

    if (texto && navigator.clipboard) {
      try { await navigator.clipboard.writeText(texto); } catch (e) {}
    }

    if (archivoImagenHoy && navigator.canShare && navigator.canShare({ files: [archivoImagenHoy] })) {
      try {
        await navigator.share({
          files: [archivoImagenHoy],
          text: texto
        });
        setTimeout(() => cargarDesdePlanilla(false), 2000);
        return;
      } catch (err) {}
    }

    const url = `https://wa.me/${numero}?text=${encodeURIComponent(texto)}`;
    window.location.href = url;
  }
</script>

</body>
</html>
